# aaPanel → Website → your site → Config (or Reverse proxy → Config file).
# Replace the default "location /" block with this. Keep aaPanel's SSL and listen lines as they are.

client_max_body_size 10m;

# Always HTTPS (same as aaPanel → SSL → "Force HTTPS"). Staff sign-in is refused from http:// ("Invalid origin")
# and the scanner camera only works over https. Leave this out if Force HTTPS is already on.
if ($scheme = http) {
    return 301 https://$host$request_uri;
}

location / {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite (don't append) so clients can't fake their IP; rate limits rely on this.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
    proxy_buffering on;
    # Pages are dynamic (availability, logged-in panels): no proxy cache.
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}

# Built assets are content-hashed: cache hard.
location /_next/static/ {
    proxy_pass http://127.0.0.1:3005;
    proxy_set_header Host $host;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# The staff app's service worker (organiser app + scanner) must never be cached, or phones keep old code.
location = /scan-sw.js {
    proxy_pass http://127.0.0.1:3005;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache";
}

# The installable app's manifest: always fresh, so name/icon changes reach installed phones.
location = /app.webmanifest {
    proxy_pass http://127.0.0.1:3005;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache";
}
